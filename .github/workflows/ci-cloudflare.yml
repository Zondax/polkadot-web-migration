name: 'Cloudflare Worker'

# The app built by vinext for Cloudflare Workers (see deploy/cloudflare.md). Runs beside the Next/Vercel CI until the
# cutover.
#   PR           → build, parity smoke on the Worker and on Next (same checks), Playwright on the Worker;
#                  same-repo PRs also upload a preview version of web-migration-dev (behind Zondax Access)
#   push dev     → same checks, then deploy web-migration-dev + Access check
#   push main    → deploy web-migration-pro, once vars.CLOUDFLARE_PRODUCTION_ENABLED is 'true'
#   manual run   → deploy web-migration-pro from the chosen branch (cutover / hotfix)
#
# This repository is public. The `checks` job uses no secrets and no environment, so it is safe for fork PRs, which
# run it on a GitHub-hosted runner instead of the self-hosted pool. Jobs that hold credentials never run for a fork
# PR. Credentials and NEXT_PUBLIC_* values live in the GitHub environments cloudflare-dev and cloudflare-production.
# Deploy steps without credentials are skipped with a notice.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the key: a release PR from dev (head_ref=dev) must not share a group with, and cancel, the
  # dev push deploy.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  # Never cancel a running deploy; PR runs can be superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  checks:
    name: 'Worker build, parity and Playwright'
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'dev')
    # Untrusted fork code never reaches the self-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'zondax-runners' }}
    env:
      CI: true
      # Public value, inlined into the client bundle at build time (required by vite.config.mts). Repository
      # variables are readable by fork PRs; secrets are not used here.
      NEXT_PUBLIC_HUB_BACKEND_URL: ${{ vars.NEXT_PUBLIC_HUB_BACKEND_URL || 'https://api.zondax.ch/hub' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Worker types are up to date
        run: |
          pnpm cf:types
          git diff --exit-code worker-configuration.d.ts

      - name: Build Worker (vinext)
        run: pnpm build:cloudflare

      - name: vinext compatibility report
        run: pnpm check:compat

      - name: Parity smoke against the Worker
        run: |
          # Own process group, so stopping it also stops vite/workerd (Playwright starts its own server later).
          setsid pnpm preview:cf > preview.log 2>&1 &
          pgid=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3300/api/health > /dev/null && break
            sleep 2
          done
          status=0
          pnpm test:worker http://127.0.0.1:3300 || { cat preview.log; status=1; }
          kill -- "-${pgid}" 2> /dev/null || true
          exit "${status}"

      - name: Parity smoke against Next (same checks)
        run: |
          pnpm build
          setsid pnpm exec next start -H 127.0.0.1 -p 3000 > next.log 2>&1 &
          pgid=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 2
          done
          status=0
          pnpm test:worker http://127.0.0.1:3000 || { cat next.log; status=1; }
          kill -- "-${pgid}" 2> /dev/null || true
          exit "${status}"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright on the Worker
        run: pnpm e2e:worker

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-worker
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 15

  dev:
    name: 'Deploy dev Worker (preview / web-migration-dev)'
    needs: checks
    # Same-repo PRs (preview upload) and pushes to dev. Never a fork PR: it must not reach the environment.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref_name == 'dev')
    runs-on: zondax-runners
    environment: cloudflare-dev
    env:
      CI: true
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_HUB_BACKEND_URL: ${{ vars.NEXT_PUBLIC_HUB_BACKEND_URL || 'https://api.zondax.ch/hub' }}
    steps:
      - name: Deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Cloudflare deploy skipped::Set secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID in the cloudflare-dev environment (deploy/cloudflare.md)."
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Worker (vinext)
        if: steps.creds.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          # No CLOUDFLARE_ENV: the top level of wrangler.jsonc (web-migration-dev) is baked into dist/*/wrangler.json.
          pnpm build:cloudflare

      - name: Worker secrets
        if: steps.creds.outputs.ready == 'true'
        env:
          SUBSCAN_API_KEY: ${{ secrets.SUBSCAN_API_KEY }}
        run: |
          secrets_file="${RUNNER_TEMP}/worker-secrets.env"
          : > "${secrets_file}"
          for key in SUBSCAN_API_KEY; do
            if [ -n "${!key}" ]; then echo "${key}=${!key}" >> "${secrets_file}"; else echo "::notice title=Server secret not set::${key}"; fi
          done

      - name: Upload preview version
        if: github.event_name == 'pull_request' && steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A preview is a version of web-migration-dev, so the Worker must have been deployed once (first push to dev).
          if ! pnpm exec wrangler versions list > /dev/null 2>&1; then
            echo "::notice title=Preview skipped::web-migration-dev is not deployed yet; previews start after the first dev deploy."
            exit 0
          fi
          # Versions share the deployed Worker's secrets; --secrets-file is not used for uploads.
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --tag "${HEAD_SHA:0:12}" \
            --message "PR #${PR_NUMBER} ${HEAD_SHA:0:12}" | tee upload.log
          url=$(grep -Eo 'https://pr-[^ ]+\.workers\.dev' upload.log | tail -1)
          # Private: the shared Zondax Access application must answer instead of the app.
          node tools/check-worker-access.mjs tools/access.json "${url}"
          echo "::notice title=Worker preview (Zondax login)::${url}"

      - name: Deploy dev Worker
        if: github.event_name == 'push' && steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          secrets_file="${RUNNER_TEMP}/worker-secrets.env"
          secrets=()
          if [ -s "${secrets_file}" ]; then secrets=(--secrets-file "${secrets_file}"); fi
          pnpm exec wrangler deploy "${secrets[@]}" | tee deploy.log
          url=$(grep -Eo 'https://[^ ]+\.workers\.dev' deploy.log | tail -1)
          # Private: unauthenticated requests only see the Access login, so verify that (and that the shared
          # application still protects this Worker).
          node tools/check-worker-access.mjs tools/access.json "${url}"
          echo "::notice title=Dev Worker (Zondax login)::${url}"

      - name: Remove local secrets
        if: always()
        run: rm -f "${RUNNER_TEMP}/worker-secrets.env" .dev.vars dist/*/.dev.vars

  production:
    name: 'Deploy production Worker'
    # Push to main deploys once vars.CLOUDFLARE_PRODUCTION_ENABLED is 'true'; a manual run (Actions → Cloudflare
    # Worker → Run workflow) deploys the chosen branch.
    if: (github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'workflow_dispatch'
    runs-on: zondax-runners
    environment: cloudflare-production
    env:
      CI: true
      CLOUDFLARE_ENV: pro
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_HUB_BACKEND_URL: ${{ vars.NEXT_PUBLIC_HUB_BACKEND_URL }}
    steps:
      - name: Production deploy gate
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENABLED: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_PRODUCTION_ENABLED == 'true' }}
        run: |
          if [ "${ENABLED}" = "true" ] && [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Production Worker not deployed::Push deploys need variable CLOUDFLARE_PRODUCTION_ENABLED=true (or run this workflow manually), plus secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID in the cloudflare-production environment."
          fi

      - name: Checkout
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: steps.gate.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and deploy web-migration-pro
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBSCAN_API_KEY: ${{ secrets.SUBSCAN_API_KEY }}
        run: |
          pnpm install --frozen-lockfile
          # CLOUDFLARE_ENV=pro selects wrangler.jsonc env.pro at build time; no --env on deploy.
          pnpm build:cloudflare
          secrets_file="${RUNNER_TEMP}/worker-secrets.env"
          : > "${secrets_file}"
          for key in SUBSCAN_API_KEY; do
            if [ -n "${!key}" ]; then echo "${key}=${!key}" >> "${secrets_file}"; else echo "::warning title=Server secret not set::${key}"; fi
          done
          secrets=()
          if [ -s "${secrets_file}" ]; then secrets=(--secrets-file "${secrets_file}"); fi
          pnpm exec wrangler deploy "${secrets[@]}" | tee deploy.log
          rm -f "${secrets_file}"
          url=$(grep -Eo 'https://[^ ]+\.workers\.dev' deploy.log | tail -1)
          curl -sf --retry 10 --retry-delay 6 --retry-all-errors "${url}/api/health" \
            | node -e 'const h=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(h); if (h.app !== "web-migration" || h.status !== "ok" || h.env !== "production") process.exit(1)'
          echo "::notice title=Production Worker::${url} (polkadot.zondax.ch follows once the zone route is enabled)"
